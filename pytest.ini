[pytest]
pythonpath = .
testpaths = tests
markers =
    unit: Pure unit tests with synthetic or isolated inputs
    integration: Pipeline, ambiguity, and service integration tests
    e2e: End-to-end tests using sample datasets
    app: Streamlit application tests using AppTest
    streamlit: Tests that require the Streamlit runtime and AppTest harness
    ui: User-visible application behaviour tests (sections, workflows, transparency)
